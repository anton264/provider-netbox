apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: DeviceBay
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/devicebay
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    description: example_description
    deviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    installedDeviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example_installed
    label: example_label
    name: example_device_bay

---

