    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: example_device
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tenantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

