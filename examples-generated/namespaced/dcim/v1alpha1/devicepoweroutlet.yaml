apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: DevicePowerOutlet
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/devicepoweroutlet
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    deviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    feedLeg: A
    name: power outlet
    type: iec-60320-c5

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: Device
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/devicepoweroutlet
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: '%[1]s'
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
