apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: InventoryItem
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/inventoryitem
  labels:
    testing.upbound.io/example-name: parent
  name: parent
  namespace: crossplane-system
spec:
  forProvider:
    deviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: Parent Item

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: Device
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/inventoryitem
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: '%[1]s'
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    tenantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: DeviceRearPort
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/inventoryitem
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    deviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    markConnected: true
    name: rear port
    positions: 1
    type: 8p8c
