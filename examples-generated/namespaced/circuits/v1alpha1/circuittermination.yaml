apiVersion: circuits.netbox.m.crossplane.io/v1alpha1
kind: CircuitTermination
metadata:
  annotations:
    meta.upbound.io/example-id: circuits/v1alpha1/circuittermination
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    circuitIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    portSpeed: 100000
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    termSide: A
    upstreamSpeed: 50000

---

apiVersion: circuits.netbox.m.crossplane.io/v1alpha1
kind: Circuit
metadata:
  annotations:
    meta.upbound.io/example-id: circuits/v1alpha1/circuittermination
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    cid: '%[1]s'
    providerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    status: active
    typeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: circuits.netbox.m.crossplane.io/v1alpha1
kind: CircuitProvider
metadata:
  annotations:
    meta.upbound.io/example-id: circuits/v1alpha1/circuittermination
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    name: '%[1]s'

---

apiVersion: circuits.netbox.m.crossplane.io/v1alpha1
kind: CircuitType
metadata:
  annotations:
    meta.upbound.io/example-id: circuits/v1alpha1/circuittermination
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    name: '%[1]s'

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: Site
metadata:
  annotations:
    meta.upbound.io/example-id: circuits/v1alpha1/circuittermination
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    name: '%[1]s'
    status: active
