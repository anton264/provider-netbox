apiVersion: vpn.netbox.m.crossplane.io/v1alpha1
kind: Tunnel
metadata:
  annotations:
    meta.upbound.io/example-id: vpn/v1alpha1/tunnel
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    description: This is a description.
    encapsulation: ipsec-transport
    name: my-tunnel
    status: active
    tenantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tunnelGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    tunnelIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: vpn.netbox.m.crossplane.io/v1alpha1
kind: TunnelGroup
metadata:
  annotations:
    meta.upbound.io/example-id: vpn/v1alpha1/tunnel
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    name: my-tunnel-group
