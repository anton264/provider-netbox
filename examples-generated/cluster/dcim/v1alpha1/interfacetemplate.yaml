apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: InterfaceTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/interfacetemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    description: eth0 description
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    label: eth0 label
    mgmtOnly: true
    name: eth0
    type: 100base-tx

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/interfacetemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: test-model
    partNumber: test-part-number
    slug: test-model

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/interfacetemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: my-manufacturer
