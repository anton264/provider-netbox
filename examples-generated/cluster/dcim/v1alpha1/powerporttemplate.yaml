apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: PowerPortTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/powerporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    label: 715W AC power supply
    maximumDraw: 715
    moduleTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: PSU-1
    type: iec-60320-c16

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/powerporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: Cisco

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ModuleType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/powerporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: PWR-C1-715WAC-P
    partNumber: PWR-C1-715WAC-P
