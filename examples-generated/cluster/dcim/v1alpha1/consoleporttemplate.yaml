apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ConsolePortTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/consoleporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    description: RJ-45 serial console port
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    label: Serial console
    name: console
    type: rj-45

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/consoleporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: PowerSwitch S4112F-ON
    partNumber: S4112F-ON
    slug: powerswitch-s4112f-on

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/consoleporttemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: Dell
