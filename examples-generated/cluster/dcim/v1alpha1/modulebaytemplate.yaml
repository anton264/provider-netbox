  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: Catalyst 9300X-24Y
    partNumber: C9300X-24Y
    slug: catalyst-9300x-24y

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
